<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You are Offline - PHS Cleaning Company</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: rgba(166, 206, 55, 0.15);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    .card {
      position: relative;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 34, 97, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-box {
      width: 76px;
      height: 76px;
      background: rgba(5, 150, 105, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 0 8px rgba(5, 150, 105, 0.04);
    }
    .icon-box svg {
      width: 38px;
      height: 38px;
      fill: #059669;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #002261;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 260px;
    }
    .btn {
      width: 100%;
      background: #002261;
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px -5px rgba(0, 34, 97, 0.25);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn.loading .spinner {
      display: inline-block;
    }
    .btn.loading .btn-text {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-badge {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="icon-box">
      <!-- Wifi Off SVG -->
      <svg viewBox="0 0 24 24">
        <path d="M23.64 7c-.45-.34-4.93-3.67-11.64-3.67-1.54 0-3 .19-4.32.53L10.3 6.48C10.86 6.43 11.42 6.4 12 6.4c5.07 0 8.78 2.37 9.17 2.65L23.64 7zM1.39 4.22l2.28 2.28C1.86 7.47.55 8.44.36 8.59L12 23.08l4.47-5.55 3.31 3.31 1.41-1.41L2.81 2.81 1.39 4.22zM5.38 8.21l3.22 3.22C7.38 12.02 5.56 12.87 4.14 13.62L5.38 8.21zm6.62 6.62l2.36 2.36L12 19.92l-2.36-2.93c.71-.47 1.5-1.04 2.36-2.16z"/>
      </svg>
    </div>

    <h1>You are Offline</h1>
    <p>Please check your internet connection or Wi-Fi settings and try again.</p>

    <button id="retry-btn" class="btn" onclick="retryConnection()">
      <span class="btn-text">Retry Connection</span>
      <span class="spinner"></span>
    </button>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Waiting for network reconnect...</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.classList.add('loading');
      btn.disabled = true;

      // Try fetching a lightweight resource
      fetch('/manifest.json?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          setTimeout(() => {
            btn.classList.remove('loading');
            btn.disabled = false;
          }, 800);
        });
    }

    // Auto-retry when internet connectivity is detected
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
